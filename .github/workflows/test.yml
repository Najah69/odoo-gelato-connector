name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/oca/oca-ci/py3.11-odoo18.0:latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
    env:
      DB_NAME: odoo
      DB_USER: odoo
      DB_PASSWORD: odoo
      DB_HOST: db
    steps:
      - uses: actions/checkout@v4
        with:
          path: gelato-connector-odoo
      - name: Install Python dependencies
        run: pip install requests
      - name: Initialize test database
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
        working-directory: gelato-connector-odoo
