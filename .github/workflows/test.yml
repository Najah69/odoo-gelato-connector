name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Odoo + dependencies
        run: |
          pip install \
            "odoo==18.0.*" \
            requests \
            psycopg2-binary \
            --extra-index-url https://wheelhouse.odoo-community.org/oca-simple/
        continue-on-error: true

      - name: Fallback — install Odoo from source
        if: failure()
        run: |
          pip install \
            odoo \
            requests \
            psycopg2-binary || true

      - name: Check module syntax (import check)
        run: |
          python -c "
          import sys, ast, os
          errors = []
          for root, dirs, files in os.walk('gelato_connector'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      try:
                          ast.parse(open(path).read())
                      except SyntaxError as e:
                          errors.append(f'{path}: {e}')
          if errors:
              print('Syntax errors:')
              for e in errors: print(e)
              sys.exit(1)
          print(f'All Python files OK')
          "

      - name: Validate manifest
        run: |
          python -c "
          import ast, sys
          with open('gelato_connector/__manifest__.py') as f:
              manifest = ast.literal_eval(f.read())
          required = ['name', 'version', 'license', 'depends']
          missing = [k for k in required if k not in manifest]
          if missing:
              print(f'Missing manifest keys: {missing}')
              sys.exit(1)
          print(f'Manifest OK: {manifest[\"name\"]} v{manifest[\"version\"]}')
          "

      - name: Check security CSV
        run: |
          python -c "
          import csv, sys
          with open('gelato_connector/security/ir.model.access.csv') as f:
              rows = list(csv.DictReader(f))
          print(f'Security CSV: {len(rows)} rules OK')
          "
